name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/check-private-files.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npx expo-doctor
