# Search a brand, check the results, open a store.
appId: app.capmedia.storetracker
name: Search
---
- runFlow:
    file: subflows/onboarding.yaml
    env:
      LOCATION: deny
- tapOn: 'Search a store'
- waitForAnimationToEnd
# iOS exposes the search bar by its placeholder; on Android it is already focused.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Search a store or a city…'
- inputText: 'Gautrand Lices'
- assertVisible: '1 store'
- tapOn: 'Gautrand Lices, .*'
- assertVisible: 'Gautrand Lices'
- assertVisible: 'Place des Lices, 35000 Rennes'
- scrollUntilVisible:
    element: 'Opening hours.*'
    direction: DOWN
