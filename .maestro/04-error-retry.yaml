# Uses the development switch that makes the mock API fail (debug builds only).
appId: app.capmedia.storetracker
name: Error and retry
---
- runFlow:
    file: subflows/onboarding.yaml
    env:
      LOCATION: deny
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      id: 'simulate-api-failure'
    direction: DOWN
- tapOn:
    id: 'simulate-api-failure'
- tapOn: 'Close'
- tapOn: 'Search a store'
- waitForAnimationToEnd
- tapOn: 'Search a store or a city…'
- inputText: 'Rambert'
- hideKeyboard
- assertVisible: 'Couldn’t load the stores'
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      id: 'simulate-api-failure'
    direction: DOWN
- tapOn:
    id: 'simulate-api-failure'
- tapOn: 'Close'
- tapOn: 'Try again'
- assertVisible: 'Rambert Annecy, .*'
