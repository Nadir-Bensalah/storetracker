# 120 stores in pages of 20: the end-of-list message only appears once every
# page has been loaded by scrolling.
appId: app.capmedia.storetracker
name: Pagination
---
- runFlow:
    file: subflows/onboarding.yaml
    env:
      LOCATION: deny
- assertVisible: '120 stores'
- assertNotVisible: 'You’ve seen them all.'
- scrollUntilVisible:
    element: 'You’ve seen them all.'
    direction: DOWN
    timeout: 90000
    speed: 80
